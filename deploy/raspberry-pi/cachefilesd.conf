# Reuse read-only NAS file ranges on local disk instead of downloading them
# for every short audio sample. Requires cachefilesd and the CIFS fsc option.
dir /var/cache/fscache
tag mycache
# Percent FREE on the cache filesystem: cull below 85%, stop allocating below
# 80%, and stop culling above 90%. These are not fixed cache size limits.
brun 90%
bcull 85%
bstop 80%
frun 10%
fcull 7%
fstop 3%
