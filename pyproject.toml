[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-playlist-extractor"
version = "0.1.0"
description = "Resumable recognition and reporting for local DJ recordings"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
shazam = ["shazamio==0.8.1"]

[project.scripts]
playlist-scan = "playlist_extractor.scanner:main"
playlist-report = "playlist_extractor.reports:main"
playlist-ui = "playlist_extractor.terminal:main"

[tool.setuptools.packages.find]
include = ["playlist_extractor*"]
